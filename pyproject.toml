[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrogen-wavefunction"
version = "0.1.0"
description = "Hydrogen Wavefunction Implementation and Validation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0",
    "scipy>=1.15.0",
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"

